<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三思 - san.si</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ffffff, #eef2f7);
      color: #111;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 820px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 18px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 10px;
      margin-bottom: 10px;
    }

    .domain {
      font-size: 14px;
      color: #888;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .wechat {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .wechat img {
      width: 180px;
      height: 180px;
      border-radius: 14px;
      border: 1px solid #eee;
      background: #fff;
    }

    .wechat span {
      font-size: 14px;
      color: #666;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #999;
    }

    footer a {
      color: #333;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 40px;
        letter-spacing: 6px;
      }

      .card {
        padding: 30px 20px;
      }

      .wechat img {
        width: 140px;
        height: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">三思</div>
    <div class="domain">san.si</div>

    <div class="wechat">
      <img src="https://www.wangxiansheng.com/static/images/wechat.png" alt="微信二维码" />
      <span>微信联系</span>
    </div>

    <footer>
      © <span id="year">2026</span> <a href="https://www.wangxiansheng.com/" target="_blank">王先生</a> 版权所有
    </footer>
  </div>
</body>
</html>
